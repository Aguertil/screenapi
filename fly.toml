# Fly.io deployment configuration for ScreenAPI

app = "screenapi-prod"
primary_region = "cdg" # Paris region

[build]
  dockerfile = "apps/screenapi/Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "43210"

[http_service]
  internal_port = 43210
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    hard_limit = 250
    soft_limit = 200

[[vm]]
  cpu_kind = "shared"
  cpus = 2
  memory_mb = 2048

# Health check
[[services]]
  internal_port = 43210
  protocol = "tcp"

  [[services.ports]]
    force_https = true
    handlers = ["http"]
    port = 80

  [[services.ports]]
    handlers = ["tls", "http"]
    port = 443

  [[services.tcp_checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "10s"

  [[services.http_checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "get"
    path = "/api/health"
    protocol = "http"

# PostgreSQL database
# Run: fly postgres create --name screenapi-db --region cdg
# Then: fly secrets set DATABASE_URL="postgresql://..."

# Redis (optional)
# Run: fly redis create --name screenapi-redis --region cdg
# Then: fly secrets set REDIS_URL="redis://..."
