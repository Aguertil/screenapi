version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: screenapi-postgres
    environment:
      POSTGRES_USER: screenapi
      POSTGRES_PASSWORD: screenapi_dev_password
      POSTGRES_DB: screenapi
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U screenapi"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: screenapi-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile.local
    container_name: screenapi-app
    ports:
      - "43210:43210"
    environment:
      DATABASE_URL: "postgresql://screenapi:screenapi_dev_password@postgres:5432/screenapi"
      REDIS_URL: "redis://redis:6379"
      NODE_ENV: "development"
      NEXT_PUBLIC_API_URL: "http://localhost:43210"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next

  # Optional: pgAdmin for database management
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: screenapi-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@screenapi.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  postgres_data:
  redis_data:
