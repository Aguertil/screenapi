# Render Blueprint for ScreenAPI
# This file defines all services needed for deployment

services:
  # Main Web Service
  - type: web
    name: screenapi-prod
    runtime: docker
    dockerfilePath: ./apps/screenapi/Dockerfile
    dockerContext: .
    region: frankfurt # EU region (closest to France)
    plan: standard # 2GB RAM, required for Playwright
    branch: main
    healthCheckPath: /api/health
    autoDeploy: true # Auto-deploy on git push
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 43210
      - key: DATABASE_URL
        fromDatabase:
          name: screenapi-db
          property: connectionString

databases:
  # PostgreSQL Database
  - name: screenapi-db
    databaseName: screenapi
    user: screenapi
    region: frankfurt
    plan: free # Free tier (512MB) - or use 'standard' for production
    ipAllowList: [] # Allow all (or restrict to your IPs)
